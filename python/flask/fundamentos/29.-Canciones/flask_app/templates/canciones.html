<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Canciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row g-4">
        <!-- Nueva Canción -->
        <div class="col-md-5">
            <div class="card p-4 shadow-sm">
                <h3>Nueva Canción</h3>
                <form action="/canciones/crear" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Título:</label>
                        <input type="text" name="titulo" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Artista:</label>
                        <input type="text" name="artista" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Crear</button>
                </form>
                <div class="mt-3">
                    <a href="/usuarios">Inicio</a>
                </div>
            </div>
        </div>

        <!-- Todas las Canciones -->
        <div class="col-md-7">
            <div class="card p-4 shadow-sm">
                <h3>Todas las Canciones</h3>
                <div class="list-group my-3">
                    {% for cancion in canciones %}
                        <a href="/canciones/{{ cancion.id }}" class="list-group-item list-group-item-action text-primary fw-bold">
                            {{ cancion.titulo }}
                        </a>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
