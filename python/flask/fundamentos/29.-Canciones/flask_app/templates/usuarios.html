<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row g-4">
        <!-- Nuevo Usuario -->
        <div class="col-md-5">
            <div class="card p-4 shadow-sm">
                <h3>Nuevo Usuario</h3>
                <form action="/usuarios/crear" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre:</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail:</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">PW:</label>
                        <input type="password" name="contrasena" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Crear</button>
                </form>
            </div>
        </div>

        <!-- Todos los Usuarios -->
        <div class="col-md-7">
            <div class="card p-4 shadow-sm">
                <h3>Todos los Usuarios</h3>
                <div class="list-group my-3">
                    {% for usuario in usuarios %}
                        <a href="/usuarios/{{ usuario.id }}" class="list-group-item list-group-item-action text-primary fw-bold">
                            {{ usuario.nombre }}
                        </a>
                    {% endfor %}
                </div>
                <a href="/canciones" class="btn btn-link p-0 text-decoration-underline">Agregar Canción</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
