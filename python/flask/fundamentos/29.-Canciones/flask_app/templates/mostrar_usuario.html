<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4">{{ usuario.nombre }}</h1>

    <div class="row g-4">
        <!-- Tabla de Favoritos -->
        <div class="col-md-6">
            <h3>Favoritos</h3>
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-secondary">
                    <tr>
                        <th>Canción</th>
                        <th>Artista</th>
                    </tr>
                </thead>
                <tbody>
                    {% for fav in usuario.favoritos %}
                        <tr>
                            <td>{{ fav.titulo }}</td>
                            <td>{{ fav.artista }}</td>
                        </tr>
                    {% else %}
                        <tr>
                            <td colspan="2" class="text-muted">Sin favoritos asignados</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
            <a href="/usuarios">Inicio</a>
        </div>

        <!-- Formulario Agregar Favorito -->
        <div class="col-md-6">
            <h3>Agregar Favorito</h3>
            <form action="/favoritos/agregar" method="POST" class="mt-3">
                <input type="hidden" name="usuario_id" value="{{ usuario.id }}">
                <input type="hidden" name="origen" value="usuario">

                <div class="mb-3">
                    <label class="form-label">Canción:</label>
                    <select name="cancion_id" class="form-select" required>
                        {% for cancion in canciones %}
                            <option value="{{ cancion.id }}">{{ cancion.titulo }} - {{ cancion.artista }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-secondary">Agregar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
