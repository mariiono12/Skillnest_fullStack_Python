<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrar Canción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1>{{ cancion.titulo }}</h1>
    <h4 class="text-muted mb-4">{{ cancion.artista }}</h4>

    <div class="row g-4">
        <!-- Usuarios que la tienen como favorita -->
        <div class="col-md-6">
            <h3>En los favoritos de:</h3>
            <ul class="list-group my-3">
                {% for usr in cancion.usuarios %}
                    <li class="list-group-item">- {{ usr.nombre }}</li>
                {% else %}
                    <li class="list-group-item text-muted">Ningún usuario la ha marcado como favorita.</li>
                {% endfor %}
            </ul>
            <a href="/usuarios">Inicio</a>
        </div>

        <!-- Formulario Agregar Favorito desde Canción -->
        <div class="col-md-6">
            <h3>Agregar Favorito</h3>
            <form action="/favoritos/agregar" method="POST" class="mt-3">
                <input type="hidden" name="cancion_id" value="{{ cancion.id }}">
                <input type="hidden" name="origen" value="cancion">

                <div class="mb-3">
                    <label class="form-label">Usuario:</label>
                    <select name="usuario_id" class="form-select" required>
                        {% for u in usuarios %}
                            <option value="{{ u.id }}">{{ u.nombre }}</option>
                        {% else %}
                            <option disabled selected>Todos los usuarios ya la agregaron</option>
                        {% endfor %}
                    </select>
                </div>
                {% if usuarios %}
                    <button type="submit" class="btn btn-secondary">Agregar</button>
                {% endif %}
            </form>
        </div>
    </div>
</div>
</body>
</html>
