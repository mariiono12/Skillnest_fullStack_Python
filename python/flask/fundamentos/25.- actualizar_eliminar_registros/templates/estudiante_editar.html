<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Estudiante {{ estudiante.id_estudiante }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="mb-1">Editar estudiante</h1>
                    <p class="text-muted mb-0">ID: {{ estudiante.id_estudiante }}</p>
                </div>
                <a href="{{ url_for('estudiantes') }}" class="btn btn-outline-secondary">Volver</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form action="{{ url_for('actualizar_estudiante') }}" method="POST">
                        <input type="hidden" name="id_estudiante" value="{{ estudiante.id_estudiante }}">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" value="{{ estudiante.nombre }}" required>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control" value="{{ estudiante.email }}" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Actualizar</button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
