<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="mb-4">
                <h1 class="mb-1">Estudiante {{ estudiante.id_estudiante }}</h1>
                <p class="text-muted">Detalles del registro.</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <p class="mb-2"><strong>Nombre:</strong> {{ estudiante.nombre }}</p>
                    <p class="mb-2"><strong>Email:</strong> {{ estudiante.email }}</p>
                    <p class="mb-4"><strong>Fecha Creación:</strong> {{ estudiante.created_at }}</p>

                    <div class="d-flex gap-2">
                        <a href="{{ url_for('editar_estudiante', id_estudiante=estudiante.id_estudiante) }}" class="btn btn-warning">Editar</a>
                        <a href="{{ url_for('eliminar_estudiante', id_estudiante=estudiante.id_estudiante) }}" 
                           class="btn btn-danger"
                           onclick="return confirm('¿Estás seguro de eliminar este estudiante?');">
                            Eliminar
                        </a>
                        <a href="{{ url_for('estudiantes') }}" class="btn btn-outline-secondary">Volver</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
