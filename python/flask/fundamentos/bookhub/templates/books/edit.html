{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4">Editar Libro</h2>

            {% with messages = get_flashed_messages(category_filter=['book_error']) %}
                {% if messages %}
                    <div class="alert alert-danger py-2">
                        {% for msg in messages %}
                            <div><small>• {{ msg }}</small></div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="/libros/actualizar/{{ book.id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Título:</label>
                    <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Autor:</label>
                    <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Género:</label>
                    <select name="genre" class="form-select" required>
                        {% for g in ['Novela', 'Fábula', 'Ciencia Ficción', 'Romance', 'Desarrollo Personal', 'Fantasía'] %}
                            <option value="{{ g }}" {% if book.genre == g %}selected{% endif %}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Fecha de publicación:</label>
                    <input type="date" name="release_date" class="form-control" value="{{ book.release_date.strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Descripción:</label>
                    <textarea name="description" class="form-control" rows="4" required>{{ book.description }}</textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-dark px-4">Actualizar</button>
                    <a href="/libros" class="btn btn-link text-decoration-none align-self-center">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
